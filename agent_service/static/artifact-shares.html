<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>发布分享 · Nexus WorkStudio</title><link rel="stylesheet" href="/project-templates.css?v=1"><script src="/secure-id.js?v=1" defer></script><script src="/artifact-shares.js?v=3" defer></script></head><body><header><a href="/">← 返回项目对话</a><span>Nexus WorkStudio</span></header><main><div class="heading"><div><h1>发布报告或汇报文件</h1><p>选择固定文件版本，限制具体企业账号和有效期。</p></div><button id="refresh" type="button">刷新</button></div><p class="note">分享前请核对整份文件、图表、附件和接收对象。允许下载原文件时，隐藏页、备注和批注等内容也会一起分享。分享不等于财务审批；已经查看或下载的内容无法撤回。HTML 只在禁用脚本和外部连接的沙箱中预览，可能与原页面不同。查看链接需要配置可信企业身份代理。</p><p id="status" role="status" aria-live="polite"></p><button id="retry" type="button" hidden>重试未确认的分享</button><div class="layout"><section class="panel"><h2>选择项目成果</h2><p>支持生成的 PPT、Word、报告，以及项目内 HTML 文件。</p><div id="artifacts"></div><button id="more" type="button" hidden>加载更多成果</button></section><section class="panel"><h2>设置分享</h2><p id="selected">请先选择左侧成果。</p><form id="form" hidden><label>成果格式 <select id="format" required></select></label><label>接收者企业身份主体（每行一个） <textarea id="subjects" rows="3" required></textarea></label><label>有效时间（小时，1–720） <input id="hours" type="number" min="1" max="720" value="168" required></label><label><input id="download" type="checkbox"> 允许下载原文件（HTML 不支持）</label><label><input id="comments" type="checkbox"> 允许获准接收者发表评论（所有获准接收者可见）</label><label><input id="confirm" type="checkbox" required> 已核对整份文件及接收者，确认分享</label><button type="submit" class="primary">创建分享链接</button></form><h2>已创建的链接</h2><div id="shares"></div></section></div></main></body></html>
