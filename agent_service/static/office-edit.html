<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调整办公成果 · Nexus WorkStudio</title><link rel="stylesheet" href="/project-templates.css?v=1"><script src="/secure-id.js?v=1" defer></script><script src="/workspace-session.js?v=1" defer></script><script src="/office-change-review.js?v=1" defer></script><script src="/office-edit.js?v=4" defer></script></head>
<body><header><a href="/">← 返回项目对话</a><span>Nexus WorkStudio</span></header><main><h1>按章节调整内容</h1><p class="note">可暂存多处文字修改、新增或移除章节并调整顺序，一次生成新文件并记录项目版本。原文件保留；移除章节时，新文件会同时移除其中的表格和图表。文字与财务数据仍需核对。此处按生成规格的章节编辑，不是幻灯片版式编辑器。</p><p id="status" role="status" aria-live="polite">正在核对成果和原始规格…</p><section class="panel" id="editor" hidden><p id="source"></p><label for="section">选择章节</label><select id="section"></select><button id="move-up" type="button">章节上移</button><button id="move-down" type="button">章节下移</button><button id="add-section" type="button">新增章节</button><button id="remove-section" type="button">从新文件移除本章节</button><button id="restore-section" type="button">撤销上次移除</button><label for="field">修改内容</label><select id="field"></select><label for="value">内容</label><textarea id="value" rows="10" maxlength="20000"></textarea><details id="change-review" open><summary>核对本次修改</summary><div id="change-review-content"><p>当前没有暂存修改。</p></div></details><label for="name">新文件名称</label><input id="name" maxlength="91" value="调整后的报告"><button id="save" type="button" class="primary">生成新文件</button><button id="retry" type="button" hidden>重试同一请求</button><button id="discard" type="button" hidden>已核对，停止重试</button><p id="result" role="status" aria-live="polite"></p></section></main></body></html>
