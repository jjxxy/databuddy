<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的数据应用 · Atlas</title><link rel="stylesheet" href="/data-app.css?v=20-ui-4"><script src="/data-app.js?v=20-ui-4" defer></script></head><body>
<section id="login" class="login" hidden><form id="login-form"><span class="logo">A</span><h1>打开你的数据应用</h1><p>使用工作空间访问口令查看数据。</p><input id="token" type="password" placeholder="访问口令" autocomplete="current-password" required><button type="submit">进入应用</button><p id="login-error" role="alert"></p></form></section>
<main id="shell" hidden><nav><a id="back" href="/">← 返回项目对话</a><span class="private">私有数据应用</span></nav><header><div><div class="eyebrow">你的数据应用</div><h1 id="title">正在打开应用…</h1><p id="description"></p><p id="freshness" class="muted"></p></div><div class="actions"><button id="rerun" disabled>重新运行</button><a id="revise" class="button" aria-disabled="true" tabindex="-1" title="请先从项目对话打开应用">对话调整</a><a id="ask" class="button primary" aria-disabled="true" tabindex="-1" title="应用结果尚未生成，请先返回项目对话查看进度">问问数据（结果生成后可用）</a></div></header>
<div id="notice" class="notice" role="status" hidden></div><section id="preview" class="preview" hidden><span>这是候选预览，尚未替换正式应用。确认后可持续重跑和定时更新。</span><button id="publish">确认采用此版本</button></section>
<section class="metrics"><div><label>符合条件的记录</label><strong id="record-count">—</strong><small>按全部筛选结果统计</small></div><div id="amount-metric" hidden><label id="amount-label"></label><strong id="amount-total">—</strong><small id="amount-note"></small></div><div><label>自动更新</label><strong id="schedule" class="schedule">未设置</strong><small id="schedule-note">可以在对话中告诉 Agent 更新频率</small></div></section>
<section id="chart-panel" class="panel" hidden><div class="panel-heading"><h2>分组汇总</h2><span>前 20 项 · 按完整筛选结果计算</span></div><div id="chart"></div><p id="negative-note" class="muted" hidden>条形长度按绝对值展示，负值使用红色。</p></section>
<section class="panel"><div class="panel-heading table-heading"><h2>业务明细</h2><form id="search-form"><input id="search" maxlength="200" placeholder="搜索全部业务字段" aria-label="搜索业务记录"><button type="submit">筛选</button></form><button id="export" disabled>导出筛选结果</button></div><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table><p id="empty" class="empty" hidden>没有符合条件的记录。</p></div><div class="pagination"><span id="page-info"></span><button id="prev">上一页</button><button id="next">下一页</button></div></section>
<footer><span id="version"></span><button id="code" disabled>下载此版本应用代码</button></footer></main></body></html>
