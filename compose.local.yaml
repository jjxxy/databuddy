name: nexus-databuddy-local
services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile.quickstart
    env_file: .env
    environment:
      DATA_DIR: /local-workspace/.nexus
      PORT: "8000"
      DATABASE_URL: sqlite:////local-workspace/.nexus/metadata.sqlite
      NEXUS_DROP_PRIVILEGES: "1"
      NEXUS_LLM_CONFIG_FILE: /run/nexus/llm.json
      NEXUS_QUICKSTART_CONTAINER: "1"
      NEXUS_LOCAL_MODE: "1"
      NEXUS_LOCAL_AUTO_STORAGE: "1"
      NEXUS_LOCAL_WORKSPACE: /local-workspace
      NEXUS_LOCAL_LABEL: "${NEXUS_LOCAL_LABEL:-本地文件夹}"
      NEXUS_RUN_UID: "${NEXUS_LOCAL_UID:-10001}"
      NEXUS_RUN_GID: "${NEXUS_LOCAL_GID:-10001}"
      NEXUS_NETWORK_MODE: "${NEXUS_NETWORK_MODE:-connected}"
      NEXUS_OPENCODE_RUNTIME: "1"
      NEXUS_DEPLOYMENT_PROFILE: single
      NEXUS_AUTH_MODE: token
      SCHEDULER_MODE: worker
      AGENT_ORCHESTRATION_MODE: separate
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    ports:
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_HTTP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: "${NEXUS_LOCAL_WORKSPACE_HOST:?Choose a local folder with start-local}"
        target: /local-workspace
        bind:
          create_host_path: false
      - type: bind
        source: ./llm.json
        target: /run/nexus/llm.json
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    mem_limit: 4g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "agent_service.quickstart_health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
