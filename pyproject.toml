[project]
name = "personal-data-agent"
version = "0.20.0"
description = "Personal data agent: ingestion, versioned transformations and business objects"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
 "duckdb>=1.3,<2", "dlt>=1.15,<2", "langgraph>=0.6,<2",
 "dbt-duckdb>=1.9,<2", "dagster>=1.11,<2", "dagster-webserver>=1.11,<2",
 "sqlalchemy>=2,<3", "psycopg2-binary>=2.9,<3", "pymysql>=1.1,<2",
 "openpyxl>=3.1,<4", "cryptography>=43", "httpx>=0.27,<1",
 "filelock>=3,<5", "croniter>=6,<7", "sqlglot>=26,<40", "pypdf>=5,<7", "pywebpush==2.5.0", "python-docx==1.2.0", "python-pptx==1.0.2", "PyJWT==2.15.1", "PyYAML==6.0.3"
]
[project.optional-dependencies]
multimodal = ["docling>=2,<3"]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["agent_service"]
[tool.pytest.ini_options]
testpaths = ["tests"]
