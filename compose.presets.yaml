# Optional overlay; the manifest can contain managed credentials. Keep it private.
services:
  nexus:
    environment:
      NEXUS_EXTENSION_PRESETS_FILE: /run/nexus/presets.json
    volumes:
      - type: bind
        source: "${NEXUS_EXTENSION_PRESETS_HOST:?Set the administrator preset JSON file path}"
        target: /run/nexus/presets.json
        read_only: true
        bind:
          create_host_path: false
